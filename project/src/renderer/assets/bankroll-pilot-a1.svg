<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 283 112" role="img" aria-labelledby="title desc">
  <title id="title">Bankroll Pilot</title>
  <desc id="desc">Jeton de poker bleu et violet avec graphique ascendant, suivi du nom Bankroll Pilot.</desc>
  <defs>
    <linearGradient id="chipGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8DA2FF"/>
      <stop offset="0.55" stop-color="#667EEA"/>
      <stop offset="1" stop-color="#C0A5FF"/>
    </linearGradient>
    <linearGradient id="pilotGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8DA2FF"/>
      <stop offset="0.55" stop-color="#667EEA"/>
      <stop offset="1" stop-color="#C0A5FF"/>
    </linearGradient>
    <radialGradient id="coreGradient" cx="35%" cy="28%" r="85%">
      <stop offset="0" stop-color="#202735"/>
      <stop offset="1" stop-color="#11151D"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(6 6)">
    <circle cx="50" cy="50" r="46" fill="#0B0D12" stroke="#2A3242" stroke-width="2"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#chipGradient)" stroke-width="10" stroke-dasharray="23 11" transform="rotate(-7 50 50)"/>
    <circle cx="50" cy="50" r="31" fill="url(#coreGradient)" stroke="#414C62" stroke-width="2"/>
    <g fill="url(#chipGradient)" filter="url(#softGlow)">
      <rect x="30" y="60" width="7" height="13" rx="1.5"/>
      <rect x="41" y="54" width="7" height="19" rx="1.5"/>
      <rect x="52" y="47" width="7" height="26" rx="1.5"/>
      <rect x="63" y="39" width="7" height="34" rx="1.5"/>
    </g>
    <path d="M25 58 C36 51 41 43 49 47 C57 51 63 39 74 29" fill="none" stroke="#F5F7FB" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M68 28 L78 26 L75 36 Z" fill="#F5F7FB"/>
  </g>

  <g transform="translate(118 18)">
    <text x="0" y="42" fill="#F5F7FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="760" letter-spacing="-1.8">Bankroll</text>
    <path d="M2 69 H76" stroke="url(#pilotGradient)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <text x="88" y="78" fill="url(#pilotGradient)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" letter-spacing="-1.2">Pilot</text>
  </g>
</svg>
